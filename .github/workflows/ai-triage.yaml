name: AI Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Classify issue with GitHub Models
        id: classify
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').trim();
            const body = (issue.body || '').trim();

            if (!title && !body) {
              core.setOutput('labels', JSON.stringify(['triage']));
              core.setOutput('summary', 'Issue body was empty. A maintainer should review it manually.');
              core.setOutput('priority', 'medium');
              core.setOutput('needs_info', 'false');
              return;
            }

            const prompt = `You are a GitHub issue triage assistant.
Analyze the issue below and return a single JSON object only.

Required keys:
- labels: an array of 1-4 labels chosen only from this exact set: triage, bug, enhancement, question, documentation, security, duplicate, good-first-issue, needs-info
- priority: one of low, medium, high, critical
- needs_info: boolean
- summary: a short sentence explaining the issue and why it was triaged this way

Issue title: ${title}
Issue body:
${body}

Output format:
{"labels":["bug","triage"],"priority":"high","needs_info":false,"summary":"The issue describes a crash in the Android app and should be prioritized for investigation."}`;

            const response = await fetch('https://models.github.ai/inference/chat/completions', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'openai/gpt-4o-mini',
                temperature: 0.2,
                messages: [
                  {
                    role: 'system',
                    content: 'You are a careful GitHub issue triage assistant. Be conservative. Return valid JSON with no markdown fences.'
                  },
                  { role: 'user', content: prompt }
                ]
              })
            });

            if (!response.ok) {
              const payload = await response.text();
              core.warning(`GitHub Models request failed (${response.status}): ${payload}`);
              core.setOutput('labels', JSON.stringify(['triage']));
              core.setOutput('summary', 'Issue was received and queued for manual triage because the AI model was unavailable.');
              core.setOutput('priority', 'medium');
              core.setOutput('needs_info', 'false');
              return;
            }

            const data = await response.json();
            const raw = data.choices?.[0]?.message?.content || '{}';
            const match = raw.match(/\{[\s\S]*\}/);
            const parsed = JSON.parse(match ? match[0] : raw);

            const labelList = Array.isArray(parsed.labels) ? parsed.labels : ['triage'];
            const sanitizedLabels = [...new Set(
              labelList
                .map((label) => String(label).trim().toLowerCase().replace(/[^a-z0-9\- ]/g, '').replace(/\s+/g, '-'))
                .filter(Boolean)
                .filter((label) => ['triage','bug','enhancement','question','documentation','security','duplicate','good-first-issue','needs-info'].includes(label))
            )];

            const labels = sanitizedLabels.length ? sanitizedLabels : ['triage'];
            const priority = ['low', 'medium', 'high', 'critical'].includes(String(parsed.priority || '').toLowerCase())
              ? String(parsed.priority).toLowerCase()
              : 'medium';
            const needsInfo = Boolean(parsed.needs_info);
            const summary = typeof parsed.summary === 'string' && parsed.summary.trim()
              ? parsed.summary.trim()
              : 'Issue was automatically triaged and flagged for maintainer review.';

            core.setOutput('labels', JSON.stringify(labels));
            core.setOutput('summary', summary);
            core.setOutput('priority', priority);
            core.setOutput('needs_info', needsInfo ? 'true' : 'false');

      - name: Apply labels and add triage comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS_JSON: ${{ steps.classify.outputs.labels }}
          SUMMARY: ${{ steps.classify.outputs.summary }}
          PRIORITY: ${{ steps.classify.outputs.priority }}
          NEEDS_INFO: ${{ steps.classify.outputs.needs_info }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const labels = JSON.parse(process.env.LABELS_JSON || '["triage"]');
            const priority = (process.env.PRIORITY || 'medium').toLowerCase();
            const needsInfo = process.env.NEEDS_INFO === 'true';
            const summary = process.env.SUMMARY || 'Issue was automatically triaged.';

            const labelColors = {
              triage: '0075ca',
              bug: 'd73a4a',
              enhancement: 'a2eeef',
              question: 'd876e3',
              documentation: '0075ca',
              security: 'b60205',
              duplicate: 'cfd3d7',
              'good-first-issue': '7057ff',
              'needs-info': 'fbca04',
              'priority-low': '0e8a16',
              'priority-medium': 'fbca04',
              'priority-high': 'd93f0b',
              'priority-critical': 'b60205'
            };

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color: labelColors[name] || 'ededed'
                  });
                } else {
                  throw error;
                }
              }
            }

            const desiredLabels = [...new Set(labels)];
            desiredLabels.push('triage');
            desiredLabels.push(`priority-${priority}`);

            if (needsInfo) {
              desiredLabels.push('needs-info');
            }

            for (const label of desiredLabels) {
              await ensureLabel(String(label).trim().toLowerCase());
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [...new Set(desiredLabels.map((label) => String(label).trim().toLowerCase()))]
            });

            const needsInfoLine = needsInfo
              ? '\n\nThis issue is missing important details. Please reply with the requested information and a maintainer will continue the triage.'
              : '';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `## AI triage\n\n- Priority: ${priority}\n- Suggested labels: ${[...new Set(desiredLabels)].join(', ')}\n\n${summary}${needsInfoLine}`
            });
