name: AI Issue Triage

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: >
      github.event.issue.user.type == 'User' &&
      !contains(github.event.issue.labels.*.name, 'triage') &&
      !contains(github.event.issue.labels.*.name, 'priority-low') &&
      !contains(github.event.issue.labels.*.name, 'priority-medium') &&
      !contains(github.event.issue.labels.*.name, 'priority-high') &&
      !contains(github.event.issue.labels.*.name, 'priority-critical')
    runs-on: ubuntu-latest

    steps:
      - name: Classify issue with GitHub Models
        id: classify
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const issue = context.payload.issue;
            const title = String(issue.title || '').trim();
            const body = String(issue.body || '').trim();

            if (!title && !body) {
              core.setOutput('labels', JSON.stringify(['triage']));
              core.setOutput('summary', 'Issue body was empty; a maintainer should review it manually.');
              core.setOutput('priority', 'medium');
              core.setOutput('needs_info', 'false');
              return;
            }

            const prompt = `
            You are a GitHub issue triage assistant.
            Return ONLY valid JSON in this format:
            {"labels":["bug","triage"],"priority":"high","needs_info":false,"summary":"Short explanation"}

            Rules:
            - labels must be from: triage, bug, enhancement, question, documentation, security, duplicate, good-first-issue, needs-info
            - priority must be one of: low, medium, high, critical
            - needs_info is boolean
            - summary must be one sentence

            Issue title: ${title}

            Issue body:
            ${body}
            `;

            try {
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: 'openai/gpt-4o-mini',
                  temperature: 0.2,
                  messages: [
                    {
                      role: 'system',
                      content: 'Return only valid JSON and no markdown.'
                    },
                    { role: 'user', content: prompt }
                  ]
                })
              });

              if (!response.ok) {
                throw new Error(`GitHub Models request failed with status ${response.status}`);
              }

              const data = await response.json();
              const raw = data.choices?.[0]?.message?.content || '{}';

              let parsed;
              try {
                parsed = JSON.parse(raw);
              } catch {
                const match = raw.match(/\{[\s\S]*\}/);
                parsed = JSON.parse(match ? match[0] : '{}');
              }

              const labels = Array.isArray(parsed.labels) ? parsed.labels : ['triage'];
              const cleanLabels = [...new Set(
                labels
                  .map(label => String(label).trim().toLowerCase().replace(/[^a-z0-9\- ]/g, '').replace(/\s+/g, '-'))
                  .filter(label => ['triage','bug','enhancement','question','documentation','security','duplicate','good-first-issue','needs-info'].includes(label))
              )];

              const priority = ['low', 'medium', 'high', 'critical'].includes(String(parsed.priority || '').toLowerCase())
                ? String(parsed.priority).toLowerCase()
                : 'medium';

              const needsInfo = Boolean(parsed.needs_info);
              const summary = typeof parsed.summary === 'string' && parsed.summary.trim()
                ? parsed.summary.trim()
                : 'Issue was automatically triaged for review.';

              core.setOutput('labels', JSON.stringify(cleanLabels.length ? cleanLabels : ['triage']));
              core.setOutput('priority', priority);
              core.setOutput('needs_info', needsInfo ? 'true' : 'false');
              core.setOutput('summary', summary);
            } catch (error) {
              core.warning(`AI triage failed: ${error.message}`);
              core.setOutput('labels', JSON.stringify(['triage']));
              core.setOutput('summary', 'AI triage unavailable; issue was tagged for manual review.');
              core.setOutput('priority', 'medium');
              core.setOutput('needs_info', 'false');
            }

      - name: Apply labels and add a triage comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS_JSON: ${{ steps.classify.outputs.labels }}
          SUMMARY: ${{ steps.classify.outputs.summary }}
          PRIORITY: ${{ steps.classify.outputs.priority }}
          NEEDS_INFO: ${{ steps.classify.outputs.needs_info }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const labels = JSON.parse(process.env.LABELS_JSON || '["triage"]');
            const priority = (process.env.PRIORITY || 'medium').toLowerCase();
            const summary = process.env.SUMMARY || 'Issue was automatically triaged.';
            const needsInfo = process.env.NEEDS_INFO === 'true';

            const allLabels = [...new Set([
              ...labels,
              'triage',
              `priority-${priority}`
            ])];

            if (needsInfo) {
              allLabels.push('needs-info');
            }

            for (const label of allLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status === 404) {
                  const colors = {
                    triage: '0075ca',
                    bug: 'd73a4a',
                    enhancement: 'a2eeef',
                    question: 'd876e3',
                    documentation: '0075ca',
                    security: 'b60205',
                    duplicate: 'cfd3d7',
                    'good-first-issue': '7057ff',
                    'needs-info': 'fbca04',
                    'priority-low': '0e8a16',
                    'priority-medium': 'fbca04',
                    'priority-high': 'd93f0b',
                    'priority-critical': 'b60205'
                  };

                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: colors[label] || 'ededed'
                  });
                } else {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: allLabels
            });

            const needsInfoText = needsInfo
              ? '\n\nThis issue is missing important details. Please add those details and a maintainer will continue the triage.'
              : '';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `## AI triage\n\n- Priority: ${priority}\n- Labels: ${allLabels.join(', ')}\n\n${summary}${needsInfoText}`
            });
