name: Crash Issue Housekeeping

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to check (optional, checks all if empty)'
        required: false

env:
  MASTER_ISSUE: 53
  CRASHLYTICS_LABEL: 'crashlytics-healthsyncandroidapp'
  REPORT_FILE: 'CRASH_CONSOLIDATION_REPORT.md'

jobs:
  check-and-consolidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      ###########################################################################
      # 1. GET ISSUE DETAILS — FIXED (no JS interpolation)
      ###########################################################################
      - name: Get newly created issue details
        id: new_issue
        env:
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber =
              context.payload.issue?.number ||
              process.env.INPUT_ISSUE_NUMBER;

            if (!issueNumber) {
              core.setFailed('No issue number found');
              return;
            }

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const hasLabel = issue.data.labels.some(
              l => l.name === process.env.CRASHLYTICS_LABEL
            );

            core.setOutput('issue_number', issueNumber.toString());
            core.setOutput('title', issue.data.title);
            core.setOutput('body', issue.data.body);
            core.setOutput('is_crashlytics', hasLabel ? 'true' : 'false');

      ###########################################################################
      # 2. EXTRACT CRASH INFO — FIXED
      ###########################################################################
      - name: Extract crash information
        id: extract_crash
        if: steps.new_issue.outputs.is_crashlytics == 'true'
        env:
          ISSUE_BODY: ${{ steps.new_issue.outputs.body }}
          ISSUE_TITLE: ${{ steps.new_issue.outputs.title }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.ISSUE_BODY || '';
            const title = process.env.ISSUE_TITLE || '';

            const crashType = title.replace(/\[.*?\]/g, '').trim();

            const versionMatch = body.match(/appVersion\s*\|\s*([\w\.-]+)/);
            const appVersion = versionMatch ? versionMatch[1] : 'unknown';

            const idMatch = body.match(/appId\s*\|\s*([^\n]+)/);
            const appId = idMatch ? idMatch[1].trim() : 'unknown';

            const crashIdMatch = body.match(/id\s*\|\s*([a-f0-9]+)/);
            const crashId = crashIdMatch ? crashIdMatch[1] : 'unknown';

            core.setOutput('crash_type', crashType);
            core.setOutput('app_version', appVersion);
            core.setOutput('app_id', appId);
            core.setOutput('crash_id', crashId);

      ###########################################################################
      # 3. CHECK DUPLICATES — FIXED
      ###########################################################################
      - name: Check for duplicates in master issue
        id: check_duplicates
        if: steps.new_issue.outputs.is_crashlytics == 'true'
        env:
          NEW_CRASH_TYPE: ${{ steps.extract_crash.outputs.crash_type }}
          NEW_APP_VERSION: ${{ steps.extract_crash.outputs.app_version }}
          NEW_CRASH_ID: ${{ steps.extract_crash.outputs.crash_id }}
          NEW_ISSUE_NUM: ${{ steps.new_issue.outputs.issue_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const masterIssue
