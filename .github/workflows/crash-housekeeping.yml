name: Crash Issue Housekeeping

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to check (optional: scans all if empty)'
        required: false

env:
  MASTER_ISSUE: 53
  CRASHLYTICS_LABEL: 'crashlytics-healthsyncandroidapp'
  REPORT_FILE: 'CRASH_CONSOLIDATION_REPORT.md'

jobs:

  ###########################################################################
  # 1. BULK SCAN MODE (workflow_dispatch WITHOUT issue_number)
  ###########################################################################
  bulk-scan:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number == ''
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: List all crashlytics issues
      id: list
      uses: actions/github-script@v7
      with:
        script: |
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: process.env.CRASHLYTICS_LABEL,
            state: 'open',
            per_page: 100
          });

          core.setOutput('issues', JSON.stringify(issues.data));

    - name: Process issues in batches with rate-limit protection
      env:
        ISSUES_JSON: ${{ steps.list.outputs.issues }}
      uses: actions/github-script@v7
      with:
        script: |
          const issues = JSON.parse(process.env.ISSUES_JSON || "[]");

          const BATCH_SIZE = 20;
          const SLEEP_MS = 5000; // 5 seconds between batches
          const MAX_RETRIES = 5;

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function safeDispatch(issueNumber) {
            let attempt = 0;

            while (attempt < MAX_RETRIES) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "crash-housekeeping.yml", // <-- your workflow filename
                  ref: "main",                           // <-- your branch
                  inputs: {
                    issue_number: issueNumber.toString()
                  }
                });

                core.info(`Dispatched workflow for issue #${issueNumber}`);
                return;

              } catch (error) {
                attempt++;

                // Rate limit protection
                if (error.status === 403 || error.status === 429) {
                  const wait = 5000 * attempt;
                  core.warning(`Rate limit hit. Waiting ${wait}ms before retry ${attempt}/${MAX_RETRIES}`);
                  await sleep(wait);
                  continue;
                }

                // Other errors → retry with backoff
                core.warning(`Error dispatching #${issueNumber}: ${error.message}. Retrying...`);
                await sleep(2000 * attempt);
              }
            }

            core.error(`Failed to dispatch workflow for issue #${issueNumber} after ${MAX_RETRIES} retries.`);
          }

          // Split into batches
          const batches = [];
          for (let i = 0; i < issues.length; i += BATCH_SIZE) {
            batches.push(issues.slice(i, i + BATCH_SIZE));
          }

          core.info(`Total crashlytics issues: ${issues.length}`);
          core.info(`Processing in ${batches.length} batches of ${BATCH_SIZE}`);

          // Process each batch with sleep between them
          for (let i = 0; i < batches.length; i++) {
            const batch = batches[i];
            core.info(`--- Batch ${i + 1}/${batches.length} ---`);

            for (const issue of batch) {
              await safeDispatch(issue.number);
            }

            if (i < batches.length - 1) {
              core.info(`Sleeping ${SLEEP_MS}ms before next batch...`);
              await sleep(SLEEP_MS);
            }
          }

    - name: Summary
      uses: actions/github-script@v7
      with:
        script: |
          core.summary.addRaw("Bulk scan completed with rate-limit protection and automatic dispatching.");

  ###########################################################################
  # 2. SINGLE ISSUE MODE (issues event OR workflow_dispatch WITH issue_number)
  ###########################################################################
  single-issue:
    if: github.event_name == 'issues' || github.event.inputs.issue_number != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve issue number
        id: resolve
        env:
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber =
              context.payload.issue?.number ||
              process.env.INPUT_ISSUE_NUMBER;

            if (!issueNumber) {
              core.setFailed('No issue number found (single-issue mode)');
              return;
            }

            core.setOutput('issue_number', issueNumber.toString());

      #######################################################################
      # The rest of your existing logic goes here unchanged
      # BUT using steps.resolve.outputs.issue_number instead of raw expressions
      #######################################################################

      - name: Get issue details
        id: new_issue
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const hasLabel = issue.data.labels.some(
              l => l.name === process.env.CRASHLYTICS_LABEL
            );

            core.setOutput('title', issue.data.title);
            core.setOutput('body', issue.data.body);
            core.setOutput('is_crashlytics', hasLabel ? 'true' : 'false');
            core.setOutput('issue_number', issueNumber.toString());

      # ... your remaining steps (extract crash info, check duplicates, update master issue, etc.)
      # They stay exactly the same except they use env variables instead of `${{ }}` inside JS.

