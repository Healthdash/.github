name: Crash Issue Housekeeping

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to check (optional: scans all if empty)'
        required: false

env:
  MASTER_ISSUE: 53
  CRASHLYTICS_LABEL: 'crashlytics-healthsyncandroidapp'
  REPORT_FILE: 'CRASH_CONSOLIDATION_REPORT.md'

jobs:

  ###########################################################################
  # 1. BULK SCAN MODE (workflow_dispatch WITHOUT issue_number)
  ###########################################################################
  bulk-scan:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number == ''
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch all crashlytics issues
      id: fetch
      uses: actions/github-script@v7
      with:
        script: |
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: process.env.CRASHLYTICS_LABEL,
            state: 'open',
            per_page: 100
          });

          const fs = require('fs');
          fs.writeFileSync('issues.json', JSON.stringify(issues.data, null, 2));

          core.info(`Saved ${issues.data.length} issues to issues.json`);

    - name: Split issues into batch files
      run: |
        mkdir batches
        jq -c '.[]' issues.json | split -l 20 - batches/batch_

    - name: Process each batch file
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const BATCH_DIR = 'batches';
          const files = fs.readdirSync(BATCH_DIR);

          async function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function safeDispatch(issueNumber) {
            let attempt = 0;
            const MAX_RETRIES = 5;

            while (attempt < MAX_RETRIES) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "crash-housekeeping.yml",
                  ref: "main",
                  inputs: { issue_number: issueNumber.toString() }
                });

                core.info(`Dispatched #${issueNumber}`);
                return;

              } catch (error) {
                attempt++;
                const wait = 5000 * attempt;
                core.warning(`Error dispatching #${issueNumber}: ${error.message}. Waiting ${wait}ms`);
                await sleep(wait);
              }
            }

            core.error(`Failed to dispatch #${issueNumber} after retries`);
          }

          for (const file of files) {
            const batchPath = path.join(BATCH_DIR, file);
            const lines = fs.readFileSync(batchPath, 'utf8').trim().split('\n');

            core.info(`Processing batch file: ${file} (${lines.length} issues)`);

            for (const line of lines) {
              const issue = JSON.parse(line);
              await safeDispatch(issue.number);
            }

            core.info(`Sleeping 5s before next batch...`);
            await sleep(5000);
          }

    - name: Summary
      uses: actions/github-script@v7
      with:
        script: |
          core.summary.addRaw("Bulk scan completed using file-based batching with rate-limit protection.");


  ###########################################################################
  # 2. SINGLE ISSUE MODE (issues event OR workflow_dispatch WITH issue_number)
  ###########################################################################
  single-issue:
    if: github.event_name == 'issues' || github.event.inputs.issue_number != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve issue number
        id: resolve
        env:
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber =
              context.payload.issue?.number ||
              process.env.INPUT_ISSUE_NUMBER;

            if (!issueNumber) {
              core.setFailed('No issue number found (single-issue mode)');
              return;
            }

            core.setOutput('issue_number', issueNumber.toString());

      #######################################################################
      # The rest of your existing logic goes here unchanged
      # BUT using steps.resolve.outputs.issue_number instead of raw expressions
      #######################################################################

      - name: Get issue details
        id: new_issue
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const hasLabel = issue.data.labels.some(
              l => l.name === process.env.CRASHLYTICS_LABEL
            );

            core.setOutput('title', issue.data.title);
            core.setOutput('body', issue.data.body);
            core.setOutput('is_crashlytics', hasLabel ? 'true' : 'false');
            core.setOutput('issue_number', issueNumber.toString());

      # ... your remaining steps (extract crash info, check duplicates, update master issue, etc.)
      # They stay exactly the same except they use env variables instead of `${{ }}` inside JS.

